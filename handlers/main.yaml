---
- name: tailscale validate assembled firewalld configuration
  listen: tailscale reload firewalld

  ansible.builtin.command:
    argv: [firewall-offline-cmd, --system-config=/etc/firewalld, --check-config]
  register: tailscale_firewalld_validation
  changed_when: false
  failed_when: >-
    tailscale_firewalld_validation.rc != 0 or
    tailscale_firewalld_validation.stdout | trim | length > 0 or
    tailscale_firewalld_validation.stderr | trim | length > 0
  check_mode: false
  when: not ansible_check_mode
- name: tailscale gather fresh service facts
  listen:
    - tailscale restart tailscaled
    - tailscale reload firewalld
    - tailscale reload networkd
    - tailscale restart knot resolver

  ansible.builtin.service_facts:
- name: tailscale inspect systemd runtime
  listen: tailscale daemon-reload

  ansible.builtin.stat:
    path: /run/systemd/system
  register: tailscale_systemd_runtime
- name: tailscale reload systemd manager
  listen: tailscale daemon-reload

  ansible.builtin.systemd_service:
    daemon_reload: true
  when:
    - not ansible_check_mode
    - ansible_facts.get("service_mgr") == "systemd"
    - tailscale_systemd_runtime.stat.isdir | default(false)
- name: tailscale reload active firewalld synchronously
  listen: tailscale reload firewalld

  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  changed_when: true
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get("firewalld.service", {}).get("state") == "running"
- name: tailscale reload active systemd-networkd
  listen: tailscale reload networkd

  ansible.builtin.command:
    argv: [networkctl, reload]
  changed_when: true
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get("systemd-networkd.service", {}).get("state") == "running"
- name: tailscale restart active tailscaled
  listen: tailscale restart tailscaled

  ansible.builtin.systemd_service:
    name: tailscaled.service
    state: restarted
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get("tailscaled.service", {}).get("state") == "running"
- name: tailscale validate knot resolver configuration
  listen: tailscale restart knot resolver

  ansible.builtin.command:
    argv: [/usr/bin/kresctl, validate, /etc/knot-resolver/config.yaml]
  changed_when: false
  check_mode: false
  when: not ansible_check_mode
- name: tailscale restart active knot resolver
  listen: tailscale restart knot resolver
  ansible.builtin.systemd_service:
    name: knot-resolver.service
    state: restarted
  when:
    - not ansible_check_mode
    - (ansible_facts.services | default({})).get("knot-resolver.service", {}).get("state") == "running"
