---
# vars file for escapace.tailscale

tailscale_architecture_map:
  amd64: amd64
  x86_64: amd64
  aarch64: arm64
  64-bit: amd64

tailscale_architecture: '{{ tailscale_architecture_map[ansible_architecture] }}'
tailscale_archive: 'tailscale_{{ tailscale_version }}_{{ tailscale_architecture }}.tgz'
tailscale_url_archive: 'https://pkgs.tailscale.com/stable/{{ tailscale_archive }}'
tailscale_url_archive_checksum: '{{ tailscale_url_archive }}.sha256'
