---
- name: install dependencies
  ansible.builtin.dnf:
    name:
      - ca-certificates
      - dnf-plugins-core
    state: present
    allowerasing: true

- name: check tailscale gpg key file
  ansible.builtin.stat:
    path: "{{ tailscale_rpm_key_path }}"
  register: tailscale_rpm_key_file

- name: download tailscale gpg key
  ansible.builtin.get_url:
    url: "{{ tailscale_rpm_key }}"
    dest: "{{ tailscale_rpm_key_path }}"
    owner: root
    group: root
    mode: "0644"

- name: import tailscale gpg key
  ansible.builtin.rpm_key:
    key: "{{ tailscale_rpm_key_path }}"
    fingerprint: "{{ tailscale_rpm_key_fingerprint }}"
    state: present
  when: not ansible_check_mode or tailscale_rpm_key_file.stat.exists

- name: install tailscale repository
  ansible.builtin.yum_repository:
    name: tailscale-stable
    file: tailscale
    description: Tailscale stable
    baseurl: "{{ tailscale_repo_baseurl }}"
    enabled: true
    gpgcheck: "{{ tailscale_gpgcheck | bool }}"
    repo_gpgcheck: "{{ tailscale_repo_gpgcheck | bool }}"
    gpgkey: "file://{{ tailscale_rpm_key_path }}"

- name: install tailscale
  ansible.builtin.dnf:
    name: "{{ tailscale_package }}"
    state: "{{ tailscale_package_state }}"
    update_cache: true
  when: not ansible_check_mode or tailscale_rpm_key_file.stat.exists
  notify:
    - tailscale restart tailscaled

- name: enable tailscaled
  ansible.builtin.systemd_service:
    name: tailscaled.service
    enabled: true

- name: check for ferm rule configuration directory
  ansible.builtin.stat:
    path: /etc/ferm/ferm.d
  register: tailscale_ferm_rule_configuration_directory

- name: check for ferm variable configuration directory
  ansible.builtin.stat:
    path: /etc/ferm/vars.d
  register: tailscale_ferm_variable_configuration_directory

- name: create directory for systemd drop-ins
  ansible.builtin.file:
    path: /etc/systemd/system/tailscaled.service.d
    owner: root
    group: root
    state: directory
    mode: "0755"
  when:
    - tailscale_ferm_rule_configuration_directory.stat.isdir | default(false)
    - tailscale_ferm_variable_configuration_directory.stat.isdir | default(false)

- name: configure tailscaled to start after ferm
  ansible.builtin.template:
    src: tailscale-service-ferm.conf.j2
    dest: /etc/systemd/system/tailscaled.service.d/010-ferm.conf
    owner: root
    group: root
    mode: "0644"
  when:
    - tailscale_ferm_rule_configuration_directory.stat.isdir | default(false)
    - tailscale_ferm_variable_configuration_directory.stat.isdir | default(false)
  notify:
    - tailscale daemon-reload
    - tailscale restart tailscaled

- name: configure tailscale ferm rules
  ansible.builtin.template:
    src: templates/ferm-tailscale.conf.j2
    dest: /etc/ferm/ferm.d/1020-tailscale.conf
    owner: root
    group: root
    mode: "0600"
  when:
    - tailscale_ferm_rule_configuration_directory.stat.isdir | default(false)
    - tailscale_ferm_variable_configuration_directory.stat.isdir | default(false)
  notify:
    - tailscale restart ferm

- name: configure tailscale ferm variables
  ansible.builtin.template:
    src: templates/ferm-tailscale-variables.conf.j2
    dest: /etc/ferm/vars.d/1010-tailscale.conf
    owner: root
    group: root
    mode: "0600"
  when:
    - tailscale_ferm_rule_configuration_directory.stat.isdir | default(false)
    - tailscale_ferm_variable_configuration_directory.stat.isdir | default(false)
  notify:
    - tailscale restart ferm

- name: configure tailscale for ec2
  ansible.builtin.include_tasks: provider-ec2.yaml
  when: provider is defined and provider == "ec2"
  tags:
    - run-tailscale

- name: configure tailscale dns
  ansible.builtin.include_tasks: dns.yaml
  when:
    - tailscale_tailnet_dns | bool
    - tailscale_tailnet_name is not none
    - tailscale_tailnet_name | length > 0
    - provider is not defined or provider != "ec2"
