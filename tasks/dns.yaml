---
- name: configure the knot resolver tailscale policy
  ansible.builtin.template:
    src: knot-resolver-policy-tailscale.lua.j2
    dest: /etc/knot-resolver/config.d/880-policy-tailscale.lua
    owner: root
    group: knot-resolver
    mode: "0640"
  tags:
    - kresd-conf
  notify:
    - tailscale restart knot resolver
