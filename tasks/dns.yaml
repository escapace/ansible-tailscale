---
- name: include escapace.kresd
  ansible.builtin.include_role:
    name: escapace.kresd
    public: true

- name: knot-resolver config.d files
  ansible.builtin.template:
    src: knot-resolver-policy-tailscale.lua.j2
    dest: /etc/knot-resolver/config.d/880-policy-tailscale.lua
    owner: root
    group: knot-resolver
    mode: "0640"
  tags:
    - kresd-conf
  notify:
    - kresd daemon-reload
